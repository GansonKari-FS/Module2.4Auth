<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth0 | Secure Login Application</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <section class="login-card">
        <div class="logo">🔐</div>

        <h1>Secure Login Portal</h1>
        <p class="subtitle">
          Welcome to my Node.js and Auth0 authentication application.
        </p>

        <div id="logged-out">
          <h2>Welcome, Guest!</h2>
          <p>Sign in securely to access your account.</p>
          <a href="/login" class="btn primary">Log In</a>
        </div>

        <div id="logged-in" hidden>
          <h2>You're Logged In!</h2>
          <p id="welcome-message"></p>
          <a href="/profile" class="btn primary">View Profile</a>
          <a href="/logout" class="btn secondary">Log Out</a>
        </div>

        <p class="footer">Protected with Auth0 Authentication</p>
      </section>
    </main>

    <script>
      async function checkAuthentication() {
        try {
          const response = await fetch("/auth-status");
          if (!response.ok) {
            throw new Error("Authentication check failed");
          }

          const data = await response.json();

          if (data.isAuthenticated) {
            document.getElementById("logged-out").hidden = true;
            document.getElementById("logged-in").hidden = false;

            document.getElementById("welcome-message").textContent =
              `Welcome back, ${data.user?.name || "User"}!`;
          }
        } catch (error) {
          console.error("Authentication error:", error);
        }
      }

      checkAuthentication();
    </script>
  </body>
</html>
